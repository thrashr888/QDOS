[workspace]
members = [
    "crates/homebrew",
    "crates/jj",
    "crates/beads",
    "crates/search",
    "crates/qdos-plugin-api",
    "crates/qdos-plugin-space",
    "crates/qdos-plugin-status",
    "crates/qdos-plugin-print",
    "crates/qdos-plugin-searchspec",
    "crates/qdos-plugin-dirmap",
    "crates/qdos-plugin-help",
    "crates/qdos-plugin-cloud",
    "crates/qdos-plugin-jj",
    "crates/qdos-plugin-proc",
    "crates/qdos-plugin-sftp",
    "crates/qdos-plugin-shell",
]
resolver = "2"

[package]
name = "rdos"
version = "0.16.0"
edition = "2021"
description = "R-DOS: A retro DOS-style file manager TUI application written in Rust"
authors = ["thrashr888"]
license = "MIT"

[lib]
name = "rdos"
path = "src/lib.rs"

[[bin]]
name = "rdos"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# File size formatting
humansize = "2.1"

# Serialization (for config)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"

# Config directory
dirs = "6.0"

# Directory traversal
walkdir = "2.5"

# System info
sysinfo = "0.37"

# Image viewing in terminal
ratatui-image = "3.0"
image = "0.25"

# Video frame extraction
ffmpeg-sidecar = "2.0"

# 3D model rendering
tobj = "4.0"            # OBJ file loading
glam = "0.29"           # 3D math (vectors, matrices)

# Markdown rendering
termimad = "0.34.1"

# Syntax highlighting
syntect = "5.2"

# Clipboard support
arboard = "3.4"

# File system notifications
notify = "8.0"

# Terminal light/dark mode detection
terminal-light = "1.8"

# PTY for interactive shell
portable-pty = "0.8"

# Terminal widget for PTY rendering
tui-term = "0.2"

# Directory jumper database support
jumprs = "0.1"

# Audio playback
rodio = "0.19"

# HTTP client (blocking, for AI API calls)
ureq = { version = "3.0", features = ["json"] }

# Web content extraction (reader mode)
dom_smoothie = "0.8"

# Database clients
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
mysql = "25"
redis = { version = "0.27", features = ["tls-native-tls"] }

# SFTP/SSH
ssh2 = "0.9"
whoami = "1.5"

# Workspace crates
homebrew = { path = "crates/homebrew" }
jj-cli = { path = "crates/jj" }
beads-cli = { path = "crates/beads" }
search-tools = { path = "crates/search" }
qdos-plugin-api = { path = "crates/qdos-plugin-api" }
qdos-plugin-space = { path = "crates/qdos-plugin-space" }
qdos-plugin-status = { path = "crates/qdos-plugin-status" }
qdos-plugin-print = { path = "crates/qdos-plugin-print" }
qdos-plugin-searchspec = { path = "crates/qdos-plugin-searchspec" }
qdos-plugin-dirmap = { path = "crates/qdos-plugin-dirmap" }
qdos-plugin-help = { path = "crates/qdos-plugin-help" }
qdos-plugin-cloud = { path = "crates/qdos-plugin-cloud" }
qdos-plugin-jj = { path = "crates/qdos-plugin-jj" }
qdos-plugin-proc = { path = "crates/qdos-plugin-proc" }
qdos-plugin-sftp = { path = "crates/qdos-plugin-sftp" }
qdos-plugin-shell = { path = "crates/qdos-plugin-shell" }
glob = "0.3.3"
ignore = "0.4.25"

# Random number generation (for games)
rand = "0.8"
base64 = "0.22.1"

# Excel file support for Q-SHEET
rust_xlsxwriter = "0.80"  # Writing xlsx
calamine = "0.32"         # Reading xlsx

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
