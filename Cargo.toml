resolver = "2"

[package]
name = "rdos"
version = "0.19.0"
edition = "2021"
description = "R-DOS: A retro DOS-style file manager TUI application written in Rust"
authors = ["thrashr888"]
license = "MIT"

[lib]
name = "rdos"
path = "src/lib.rs"

[[bin]]
name = "rdos"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# File size formatting
humansize = "2.1"

# Serialization (for config)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"

# Config directory
dirs = "6.0"

# Directory traversal
walkdir = "2.5"

# System info
sysinfo = "0.37"

# Image viewing in terminal
ratatui-image = "3.0"
image = "0.25"

# SVG rendering
resvg = "0.44"
tiny-skia = "0.11"

# Video frame extraction
ffmpeg-sidecar = "2.0"

# 3D model rendering
tobj = "4.0"            # OBJ file loading
glam = "0.29"           # 3D math (vectors, matrices)

# Markdown rendering
termimad = "0.34.1"

# Syntax highlighting
syntect = "5.2"

# Clipboard support
arboard = "3.4"

# File system notifications
notify = "8.0"

# Terminal light/dark mode detection
terminal-light = "1.8"

# PTY for interactive shell
portable-pty = "0.8"

# Terminal widget for PTY rendering
tui-term = "0.2"

# Directory jumper database support
jumprs = "0.1"

# Audio playback
rodio = "0.19"

# HTTP client (blocking, for AI API calls)
ureq = { version = "3.0", features = ["json"] }

# Web content extraction (reader mode)
dom_smoothie = "0.8"

# Database clients
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
mysql = "25"
redis = { version = "0.27", features = ["tls-native-tls"] }

# SFTP/SSH
ssh2 = "0.9"
whoami = "1.5"

# Workspace crates
homebrew = { path = "crates/homebrew" }
jj-cli = { path = "crates/jj" }
beads-cli = { path = "crates/beads" }
search-tools = { path = "crates/search" }
