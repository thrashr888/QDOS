# DOSBox-X configuration for R-DOS examples
# This fixes OpenGL issues on macOS

[sdl]
# Use texture output instead of OpenGL (fixes macOS GL context errors)
output = texture
fullscreen = false
windowresolution = 640x480

[render]
# Aspect ratio correction for proper display
aspect = true
scaler = normal2x

[cpu]
# Standard 386 for classic DOS games
core = auto
cputype = 386
cycles = auto

[dosbox]
# Machine type for best compatibility
machine = svga_s3
