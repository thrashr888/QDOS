[package]
name = "qdos-plugin-qform"
version = "0.1.0"
edition = "2021"
description = "Q-FORM form builder plugin for R-DOS - Microsoft Access/Google Forms inspired"
authors = ["thrashr888"]
license = "MIT"

[dependencies]
qdos-plugin-api = { path = "../qdos-plugin-api" }
inventory = "0.3"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
uuid = { version = "1.0", features = ["v4"] }
