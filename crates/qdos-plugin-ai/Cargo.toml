[package]
name = "qdos-plugin-ai"
version = "0.1.0"
edition = "2021"
description = "R-DOS plugin: ai"
license = "MIT"
repository = "https://github.com/thrashr888/QDOS"

[dependencies]
qdos-plugin-api = { path = "../qdos-plugin-api" }
inventory = "0.3"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.0", features = ["json"] }
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
