[package]
name = "qdos-plugin-qcode"
version = "0.1.0"
edition = "2021"
description = "Q-CODE IDE plugin for R-DOS - Simple code editor with syntax highlighting"
authors = ["thrashr888"]
license = "MIT"

[dependencies]
qdos-plugin-api = { path = "../qdos-plugin-api" }
inventory = "0.3"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
