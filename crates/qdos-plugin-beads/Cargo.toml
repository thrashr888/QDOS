[package]
name = "qdos-plugin-beads"
version = "0.1.0"
edition = "2021"
description = "Beads issue tracking plugin for R-DOS"
authors = ["thrashr888"]
license = "MIT"

[dependencies]
# Plugin API
qdos-plugin-api = { path = "../qdos-plugin-api" }
inventory = "0.3"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Beads CLI for operations
beads-cli = { path = "../beads" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config directory
dirs = "6.0"
