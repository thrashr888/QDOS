[package]
name = "qdos-plugin-database"
version = "0.1.0"
edition = "2021"
description = "database plugin for R-DOS"
authors = ["thrashr888"]
license = "MIT"

[dependencies]
qdos-plugin-api = { path = "../qdos-plugin-api" }
inventory = "0.3"
ratatui = "0.29"
crossterm = "0.28"
chrono = "0.4"
mysql = "25"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
toml = "0.8"
