[package]
name = "qdos-plugin-games"
version = "0.1.0"
edition = "2021"
description = "R-DOS plugin: games"
license = "MIT"
repository = "https://github.com/thrashr888/QDOS"

[dependencies]
qdos-plugin-api = { path = "../qdos-plugin-api" }
qdos-plugin-qmind = { path = "../qdos-plugin-qmind" }
qdos-sound = { path = "../qdos-sound" }
inventory = "0.3"
ratatui = "0.29"
crossterm = "0.28"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
ratatui-image = "3.0"
image = "0.25"
base64 = "0.22"
