[package]
name = "qdos-plugin-audio"
version = "0.1.0"
edition = "2021"
description = "audio plugin for R-DOS"
authors = ["thrashr888"]
license = "MIT"

[dependencies]
qdos-plugin-api = { path = "../qdos-plugin-api" }
inventory = "0.3"
ratatui = "0.29"
crossterm = "0.28"
rodio = { version = "0.17", features = ["symphonia-all"], optional = true }
dirs = "5.0"

[features]
default = ["rodio"]
