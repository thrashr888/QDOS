[package]
name = "qdos-plugin-sftp"
version = "0.1.0"
edition = "2021"
description = "SFTP file transfer plugin for QDOS"
authors = ["thrashr888"]
license = "MIT"

[dependencies]
qdos-plugin-api = { path = "../qdos-plugin-api" }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
ssh2 = "0.9"
whoami = "1.5"
dirs = "6.0"
toml = "0.9.8"
