name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rdos
            asset_name: rdos-linux-x86_64

          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: rdos
            asset_name: rdos-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rdos.exe
            asset_name: rdos-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if [[ "$name" == *.exe ]]; then
              cp "$dir"/* "release/$name"
            else
              cp "$dir"/* "release/$name"
              chmod +x "release/$name"
            fi
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Compute SHA256 sums
        id: sha
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          curl -sL "https://github.com/thrashr888/QDOS/releases/download/${TAG_NAME}/rdos-macos-aarch64" -o rdos-macos-aarch64
          echo "darwin_arm64=$(sha256sum rdos-macos-aarch64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew formula
        uses: thrashr888/homebrew-tap@main
        with:
          formula: rdos
          tag: ${{ github.ref_name }}
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          darwin-arm64-sha256: ${{ steps.sha.outputs.darwin_arm64 }}
          template: |
            class Rdos < Formula
              desc "R-DOS: A modern TUI file manager inspired by Q-DOS II, written in Rust"
              homepage "https://github.com/thrashr888/QDOS"
              version "${VERSION}"
              license "MIT"

              depends_on "git"
              depends_on "ripgrep"
              depends_on "ffmpeg" => :recommended
              depends_on "imagemagick" => :recommended
              depends_on "pandoc" => :recommended
              depends_on "fluid-synth" => :recommended

              on_macos do
                on_arm do
                  url "https://github.com/thrashr888/QDOS/releases/download/${TAG}/rdos-macos-aarch64"
                  sha256 "${SHA_DARWIN_ARM64}"

                  def install
                    bin.install "rdos-macos-aarch64" => "rdos"
                  end
                end

                on_intel do
                  odie "Intel Mac binaries are no longer provided. Please build from source or use an Apple Silicon Mac."
                end
              end

              test do
                assert_match "rdos", shell_output("#{bin}/rdos --version 2>&1", 1)
              end
            end
